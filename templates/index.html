<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Sandip Karmakar Portfolio </title>
  <meta name="description" content="">
  <meta name="keywords" content="">

  <!-- Favicons -->
  <link rel="shortcut icon" href="{{ data.personal.logo }}" type="image/x-icon">
  <link rel="icon" href="{{ data.personal.logo }}" type="image/x-icon">
  <link rel="apple-touch-icon" href="{{ data.personal.logo }}">

  <!-- Google Fonts optimization -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Font stylesheet -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- MAin CSS -->
  <link rel="stylesheet" href="static/css/main/style_index.css">
</head>

<body>

  <!-- Header Stert -->
  <header>
    <nav id="navbar">
      <div class="logo">
        <img src="{{ data.personal.logo }}" alt="Sandip Karmakar Logo"
          style="width: 120px; height: 50px; object-fit: contain; display: block;">
      </div>
    </nav>
  </header><!-- Header Stop -->

  <main>

    <!-- Home Section-->
    <section class="hero" id="home">
      <div class="hero-content">
        <h1 class="hero-head">Hi, I'm {{ data.personal.name.split(' ')[0] }}<br>
          <span>{{ data.personal.name.split(' ')[1]}}</span>
        </h1>
        <p style="font-size:2rem; font-weight:300;">Ph.D. Scholar at Jadavpur University</p>
        <h2 class="hero-head">Specializing in <span id="typed"></span></h2>
        <div class="social-icons">
          <a href="{{ data.personal.github }}" aria-label="GitHub" target="_blank" rel="noopener noreferrer"> <i
              class="fa-brands fa-github"></i></a>
          <a href="{{ data.personal.linkedin }}" aria-label="LinkedIn" target="_blank" rel="noopener noreferrer"> <i
              class="fa-brands fa-linkedin"></i></a>
          <a href="{{ data.personal.scholar }}" aria-label="Google Scholar" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-google-scholar"></i></a>
          <a href="{{ data.personal.orcid }}" aria-label="ORCiD" target="_blank" rel="noopener noreferrer"> <i
              class="fa-brands fa-orcid"></i></a>
          <a href="{{ data.personal.researchgate }}" aria-label="ResearchGate" target="_blank"
            rel="noopener noreferrer"> <i class="fa-brands fa-researchgate"></i></a>
        </div>
        <div class="btns">
          <a class="btn primary" href="/about" target="_self">View More</a>
          <a class="btn primary" href="/contact" target="_self">Contact</a>
        </div>
      </div>
    </section><!-- /Hero Section -->
  </main>
</body>
<script src="static/js/vendor/typed.js/typed.umd.js"></script>
<script src="static/js/main/script_index.js"></script>

</html>
